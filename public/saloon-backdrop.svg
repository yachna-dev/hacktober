<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice" role="img" aria-label="An illustrated Indian barbershop: a barber shaving a customer in a vintage chair, men on a bench reading Hindi newspapers">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8432a"/>
      <stop offset="0.55" stop-color="#8d3520"/>
      <stop offset="1" stop-color="#6f2716"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d2113"/>
      <stop offset="1" stop-color="#2a1009"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe0e2"/>
      <stop offset="0.5" stop-color="#9fb8bd"/>
      <stop offset="1" stop-color="#c6d8db"/>
    </linearGradient>
    <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0f07" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#2b0f07" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f8b82"/>
      <stop offset="0.4" stop-color="#e6e0d4"/>
      <stop offset="1" stop-color="#8a857b"/>
    </linearGradient>
    <clipPath id="poleClip">
      <rect x="62" y="210" width="56" height="360" rx="28"/>
    </clipPath>
    <pattern id="stripes" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="none"/>
      <rect x="44" width="2" height="90" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#stripes)"/>
  <rect y="680" width="1600" height="220" fill="url(#floor)"/>
  <rect y="672" width="1600" height="12" fill="#3a170d"/>

  <!-- hanging bulb -->
  <line x1="770" y1="0" x2="770" y2="150" stroke="#2a1009" stroke-width="4"/>
  <circle cx="770" cy="164" r="70" fill="url(#glow)"/>
  <circle cx="770" cy="156" r="16" fill="#ffe9b8"/>

  <!-- wall clock -->
  <circle cx="985" cy="150" r="42" fill="#f0e6d2" stroke="#c8a878" stroke-width="6"/>
  <line x1="985" y1="150" x2="985" y2="124" stroke="#4a3a2a" stroke-width="4" stroke-linecap="round"/>
  <line x1="985" y1="150" x2="1006" y2="158" stroke="#4a3a2a" stroke-width="4" stroke-linecap="round"/>

  <!-- mirror -->
  <rect x="512" y="176" width="306" height="214" rx="10" fill="#e9d9b8"/>
  <rect x="524" y="188" width="282" height="190" rx="6" fill="url(#mirror)"/>
  <polygon points="540,378 690,196 760,196 596,378" fill="#ffffff" opacity="0.28"/>

  <!-- framed pictures -->
  <rect x="140" y="168" width="150" height="182" rx="6" fill="#e9d9b8"/>
  <rect x="152" y="180" width="126" height="158" rx="4" fill="#c98a5e"/>
  <circle cx="215" cy="238" r="32" fill="#8d5a34"/>
  <path d="M180 338 q35 -70 70 0 z" fill="#8d5a34"/>
  <rect x="330" y="196" width="118" height="148" rx="6" fill="#e9d9b8"/>
  <rect x="340" y="206" width="98" height="128" rx="4" fill="#b8c8b0"/>

  <!-- shelf with bottles -->
  <rect x="1120" y="236" width="300" height="14" rx="4" fill="#5a3520"/>
  <g>
    <rect x="1146" y="188" width="26" height="50" rx="4" fill="#6fa8b8" opacity="0.85"/>
    <rect x="1186" y="176" width="22" height="62" rx="4" fill="#c86b6b" opacity="0.85"/>
    <rect x="1222" y="192" width="28" height="46" rx="4" fill="#8fbf8a" opacity="0.85"/>
    <rect x="1266" y="182" width="24" height="56" rx="4" fill="#d8b46a" opacity="0.85"/>
    <rect x="1304" y="190" width="26" height="48" rx="4" fill="#9a86c0" opacity="0.85"/>
    <rect x="1350" y="180" width="22" height="58" rx="4" fill="#6fa8b8" opacity="0.85"/>
  </g>

  <!-- barber pole -->
  <rect x="62" y="210" width="56" height="360" rx="28" fill="#f2eee6"/>
  <g clip-path="url(#poleClip)">
    <rect x="42" y="210" width="96" height="360" fill="#f2eee6"/>
    <g fill="#c8402f">
      <rect x="42" y="230" width="96" height="26" transform="skewY(-18)" opacity="0.95"/>
      <rect x="42" y="304" width="96" height="26" transform="skewY(-18)" opacity="0.95"/>
      <rect x="42" y="378" width="96" height="26" transform="skewY(-18)" opacity="0.95"/>
      <rect x="42" y="452" width="96" height="26" transform="skewY(-18)" opacity="0.95"/>
    </g>
    <g fill="#2f5f8a">
      <rect x="42" y="266" width="96" height="14" transform="skewY(-18)" opacity="0.9"/>
      <rect x="42" y="340" width="96" height="14" transform="skewY(-18)" opacity="0.9"/>
      <rect x="42" y="414" width="96" height="14" transform="skewY(-18)" opacity="0.9"/>
      <rect x="42" y="488" width="96" height="14" transform="skewY(-18)" opacity="0.9"/>
    </g>
  </g>
  <rect x="52" y="196" width="76" height="22" rx="8" fill="url(#chrome)"/>
  <rect x="52" y="562" width="76" height="22" rx="8" fill="url(#chrome)"/>

  <!-- bench -->
  <ellipse cx="1230" cy="690" rx="230" ry="16" fill="#1c0a04" opacity="0.5"/>
  <rect x="1040" y="600" width="420" height="30" rx="8" fill="#6b4226"/>
  <rect x="1040" y="440" width="420" height="22" rx="6" fill="#5a3520"/>
  <rect x="1052" y="456" width="18" height="150" fill="#4a2a17"/>
  <rect x="1430" y="456" width="18" height="150" fill="#4a2a17"/>
  <rect x="1066" y="628" width="20" height="60" fill="#4a2a17"/>
  <rect x="1414" y="628" width="20" height="60" fill="#4a2a17"/>

  <!-- seated man 1 -->
  <g>
    <path d="M1096 628 l-16 62" stroke="#2a2a30" stroke-width="24" stroke-linecap="round"/>
    <path d="M1152 628 l18 62" stroke="#2a2a30" stroke-width="24" stroke-linecap="round"/>
    <rect x="1086" y="470" width="80" height="150" rx="26" fill="#3f5670"/>
    <circle cx="1126" cy="440" r="27" fill="#c98a5e"/>
    <path d="M1099 432 q27 -34 54 0 q-27 -14 -54 0 z" fill="#241610"/>
    <rect x="1082" y="512" width="88" height="58" rx="3" fill="#efe7d6" transform="rotate(-4 1126 541)"/>
    <line x1="1094" y1="528" x2="1158" y2="524" stroke="#b9ae97" stroke-width="3"/>
    <line x1="1094" y1="540" x2="1158" y2="536" stroke="#b9ae97" stroke-width="3"/>
    <line x1="1094" y1="552" x2="1158" y2="548" stroke="#b9ae97" stroke-width="3"/>
  </g>

  <!-- seated man 2 -->
  <g>
    <path d="M1276 628 l-14 62" stroke="#2a2a30" stroke-width="24" stroke-linecap="round"/>
    <path d="M1332 628 l16 62" stroke="#2a2a30" stroke-width="24" stroke-linecap="round"/>
    <rect x="1266" y="476" width="80" height="146" rx="26" fill="#7a4a34"/>
    <circle cx="1306" cy="446" r="27" fill="#b97a4e"/>
    <path d="M1279 438 q27 -34 54 0 q-27 -14 -54 0 z" fill="#1d1310"/>
    <rect x="1262" y="518" width="88" height="58" rx="3" fill="#efe7d6" transform="rotate(3 1306 547)"/>
    <line x1="1274" y1="534" x2="1338" y2="538" stroke="#b9ae97" stroke-width="3"/>
    <line x1="1274" y1="546" x2="1338" y2="550" stroke="#b9ae97" stroke-width="3"/>
    <line x1="1274" y1="558" x2="1338" y2="562" stroke="#b9ae97" stroke-width="3"/>
  </g>

  <!-- barber chair -->
  <ellipse cx="648" cy="694" rx="112" ry="20" fill="#1c0a04" opacity="0.55"/>
  <rect x="620" y="558" width="56" height="128" rx="8" fill="#4a2a17"/>
  <ellipse cx="648" cy="688" rx="86" ry="14" fill="url(#chrome)"/>
  <rect x="556" y="394" width="40" height="176" rx="16" fill="#6e1f1a"/>
  <rect x="552" y="360" width="64" height="34" rx="14" fill="#83241d"/>
  <rect x="560" y="540" width="184" height="42" rx="14" fill="#7a231c"/>
  <rect x="556" y="506" width="168" height="16" rx="8" fill="url(#chrome)"/>

  <!-- customer -->
  <g>
    <path d="M690 566 l-22 104" stroke="#22303f" stroke-width="34" stroke-linecap="round"/>
    <path d="M744 578 l34 88" stroke="#2a3a4a" stroke-width="34" stroke-linecap="round"/>
    <path d="M664 430 q44 -22 88 0 l40 176 q-84 26 -168 0 z" fill="#f2ede4"/>
    <path d="M700 452 q10 90 2 148" stroke="#d9d2c4" stroke-width="4" fill="none"/>
    <circle cx="708" cy="398" r="36" fill="#c98a5e"/>
    <path d="M672 392 q36 -46 72 0 q-36 -20 -72 0 z" fill="#1d1310"/>
    <path d="M676 384 q32 -30 64 -4" stroke="#efe7d6" stroke-width="6" fill="none" opacity="0.9"/>
  </g>

  <!-- barber -->
  <g>
    <rect x="842" y="560" width="70" height="132" rx="10" fill="#33302e"/>
    <rect x="836" y="398" width="82" height="182" rx="28" fill="#f2ede4"/>
    <path d="M877 402 v176" stroke="#d9d2c4" stroke-width="4"/>
    <circle cx="877" cy="366" r="30" fill="#b97a4e"/>
    <path d="M847 360 q30 -40 60 0 q-30 -18 -60 0 z" fill="#241610"/>
    <path d="M848 424 C 810 430, 770 424, 742 414" stroke="#f2ede4" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="740" cy="414" r="13" fill="#b97a4e"/>
    <rect x="700" y="404" width="46" height="10" rx="4" fill="url(#chrome)" transform="rotate(-16 723 409)"/>
  </g>

  <!-- warm top fade + baked-in title -->
  <rect width="1600" height="240" fill="url(#topfade)"/>
  <text x="800" y="104" text-anchor="middle" fill="#f6e7c9" font-family="'Nirmala UI','Noto Sans Devanagari','Mangal',serif" font-size="92" font-weight="600" letter-spacing="2">डीलक्स सैलून</text>
  <text x="800" y="150" text-anchor="middle" fill="#e8d3ae" font-family="Georgia,'Times New Roman',serif" font-size="24" letter-spacing="10">DELUXE SALOON • OPEN ALL HOURS</text>
</svg>
